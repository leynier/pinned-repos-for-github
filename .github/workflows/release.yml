name: Release

# Push a tag that matches package.json (`git tag v0.2.0 && git push origin v0.2.0`). The workflow
# builds every browser zip, attaches them to a GitHub release and, for each store whose secrets
# are configured, submits the new version for review. Stores without secrets are skipped.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: pnpm compile
      - run: pnpm test
      - run: pnpm zip
      - run: pnpm zip:firefox
      - run: pnpm zip:edge

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .output/*.zip --title "$GITHUB_REF_NAME" --generate-notes

      - name: Submit to the Chrome Web Store
        if: env.CHROME_EXTENSION_ID != ''
        run: >-
          pnpm wxt submit
          --chrome-zip ".output/pinned-repos-for-github-$VERSION-chrome.zip"
          --chrome-api-version v2
          --chrome-extension-id "$CHROME_EXTENSION_ID"
          --chrome-publisher-id "$CHROME_PUBLISHER_ID"
          --chrome-service-account-client-email "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL"
          --chrome-service-account-private-key "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY"

      - name: Submit to Firefox Add-ons
        if: env.FIREFOX_EXTENSION_ID != ''
        run: >-
          pnpm wxt submit
          --firefox-zip ".output/pinned-repos-for-github-$VERSION-firefox.zip"
          --firefox-sources-zip ".output/pinned-repos-for-github-$VERSION-sources.zip"
          --firefox-extension-id "$FIREFOX_EXTENSION_ID"
          --firefox-jwt-issuer "$FIREFOX_JWT_ISSUER"
          --firefox-jwt-secret "$FIREFOX_JWT_SECRET"

      - name: Submit to Microsoft Edge Add-ons
        if: env.EDGE_PRODUCT_ID != ''
        run: >-
          pnpm wxt submit
          --edge-zip ".output/pinned-repos-for-github-$VERSION-edge.zip"
          --edge-product-id "$EDGE_PRODUCT_ID"
          --edge-client-id "$EDGE_CLIENT_ID"
          --edge-api-key "$EDGE_API_KEY"
