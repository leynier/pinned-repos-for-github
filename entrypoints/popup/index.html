<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinned Repos for GitHub</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Pinned repositories</h1>
        <span id="count" class="muted"></span>
      </header>
      <form id="add-form" autocomplete="off">
        <label for="repo-input" class="visually-hidden">Repository</label>
        <input
          id="repo-input"
          name="repo"
          type="text"
          placeholder="owner/repo or GitHub URL"
          spellcheck="false"
        />
        <button type="submit">Pin</button>
      </form>
      <p id="message" role="status" class="muted"></p>
      <ul id="pin-list"></ul>
      <footer>
        <label for="visible-count">Show</label>
        <input id="visible-count" type="number" min="1" max="500" step="1" inputmode="numeric" />
        <label for="visible-count">in the sidebar before “Show more”</label>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
